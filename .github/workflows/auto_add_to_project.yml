name: Auto-add Issues to Project v1.2

on:
  issues:
    types: [opened, labeled]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to NeuroBloom v1.2 project
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const projectId = 'PVT_kwHODMx3h84A-G6s'; // NeuroBloom v1.2 – Inspire & Evolve
            const contentId = context.payload.issue.node_id;

            const result = await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                  item {
                    id
                  }
                }
              }
            `, {
              projectId: projectId,
              contentId: contentId
            });

            console.log(`✅ Issue added to project:`, result.addProjectV2ItemById.item.id);
